name: daily-update

on:
  schedule:
    - cron: '0 21 * * *'        # 21:00 UTC daily ≈ 06:00 KST — news/blogs/wiki
  workflow_dispatch: {}          # manual run from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Two probes in one step: are the three LLM providers reachable, and
      # does every feed in feeds.txt still parse into items? Neither reads or
      # writes events.json, so this runs before collection and its failure
      # never blocks the run.
      - name: Health check (LLM providers + feed parsing)
        continue-on-error: true
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: openai/gpt-oss-120b
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          MISTRAL_MODEL: mistral-small-latest
        run: python scripts/check_health.py

      # ---- Layer 0: daily query & keyword-filter optimizer (Gemini) ----
      - name: Layer 0 — optimize search queries & keyword filters
        continue-on-error: true   # 최적화 실패해도 수집은 계속 진행
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
        run: python scripts/optimize.py

      # ---- Layer 1: news (GDELT pool + NewsAPI), hybrid keyword→Gemini filter ----
      - name: Layer 1a — GDELT free news pool (no key, unlimited)
        run: python scripts/collect_gdelt.py

      - name: Layer 1 — news + free hybrid filter (keyword → Gemini → Groq → Mistral → fallback)
        env:
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          # 기사 N건을 한 요청으로 판단 (프롬프트 재전송·요청수 절감). 1이면 기존 개별 처리.
          LLM_BATCH: "5"
        run: python scripts/collect_news.py

      # ---- Layer 2: first-party feeds (AI platforms / Companies / Blogs) ----
      - name: Layer 2 — first-party feeds (keyword pre-filter → Gemini → Groq → Mistral)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          LLM_BATCH: "5"
        run: python scripts/collect_feeds.py

      - name: Company trend — Wikipedia pageviews (free, no key)
        run: python scripts/collect_wiki.py

      # ---- Supply-axis signal: samsung.com real-user CWV (CrUX, free key) ----
      # Weekly-granularity data; running daily just refreshes the latest week.
      # Skips quietly if CRUX_API_KEY is unset.
      - name: Supply axis — CrUX Core Web Vitals history
        continue-on-error: true   # CrUX 실패해도 나머지 수집은 계속
        env:
          CRUX_API_KEY: ${{ secrets.CRUX_API_KEY }}
        run: python scripts/collect_crux.py


      # ---- Credibility layer: score the ledger's own predictions ----
      # Every stored event is a prediction (direction/strength/horizon) that
      # nothing ever checked. This scores the elapsed ones against the traffic
      # proxy, builds the daily event-pressure series, and runs a permutation
      # test so a small-sample coincidence can't read as a finding.
      # No API keys — reads events.json + wiki_series.json only.
      - name: Score predictions (calibration + permutation test)
        run: python scripts/score_predictions.py

      # ---- Weekly: how much do the three judges actually agree? ----
      # Label noise is a ceiling on everything downstream. Weekly (Mondays)
      # because it costs one batch request per provider.
      - name: LLM label agreement (Mondays)
        if: ${{ github.event_name == 'workflow_dispatch' || steps.statday.outputs.dow == '1' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-2.5-flash
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          LLM_BATCH: "10"
        continue-on-error: true   # 측정용 — 실패해도 파이프라인은 계속
        run: python scripts/check_llm_agreement.py

      - name: Rebuild dashboard
        run: python scripts/build.py

      - name: Commit updated data + page
        run: |
          git config user.name  "github-actions"
          git config user.email "actions@github.com"
          # Add only the paths that exist. Several outputs are produced
          # conditionally — llm_agreement.json on Mondays,
          # crux_series.json only with a key — and `git add` aborts
          # the WHOLE command with exit 128 on the first missing pathspec,
          # staging nothing. That killed 2026-08-11..13: llm_agreement.json
          # does not exist Tue-Sun, so three days of collection were built but
          # never committed and Pages never redeployed.
          for f in data/events.json data/feed_state.json data/model_status.json \
                   data/wiki_series.json data/gdelt_pool.json \
                   data/crux_series.json data/query_performance.json \
                   data/feed_performance.json data/llm_usage.json \
                   data/prediction_scores.json data/event_pressure.json \
                   data/llm_agreement.json data/optimize_log.json \
                   data/feed_health.json queries.txt kw_news.txt kw_feeds.txt \
                   index.html; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git commit -m "daily update $(date -u +%F)" || echo "no changes"
          git push

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
